name: THOX Agent Team

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

jobs:
  policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate THOX agent-team policy files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/thox-agent-team.yml
          test -f docs/thox-agent-team.md
          grep -q "## Safe merge gates" docs/thox-agent-team.md
          grep -q "## Branch pruning" docs/thox-agent-team.md
          echo "THOX agent-team policy validated for: $GITHUB_EVENT_NAME"
